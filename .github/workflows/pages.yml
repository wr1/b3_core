# Deploy prebuilt static docs (site/) to GitHub Pages.
# Build locally with `make docs-build` (dockb-export, basePath=/b3_core), commit site/, push.
# Repo Settings → Pages → Source: GitHub Actions.

name: Pages

on:
  push:
    branches: [main, master]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy site/
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Require prebuilt site/
        run: |
          test -f site/index.html
          test -d site/docs
          test -d site/figures
          # basePath must match the project Pages URL (/b3_core)
          grep -q '/b3_core/' site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
