name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (pre-commit / ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pre-commit + ruff
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pre-commit>=4.0" "ruff>=0.8"

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      # Headless OpenGL for PyVista/VTK (package may call pv.start_xvfb()).
      - name: Install headless GL + xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb \
            libgl1 \
            libglx-mesa0 \
            libosmesa6 \
            libglu1-mesa \
            libxrender1 \
            libxext6 \
            libsm6 \
            libxt6 \
            libxi6

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Create virtual environment
        run: uv venv --python ${{ matrix.python-version }}

      # Local path sources (b3_mat, treeparse) do not exist on the runner.
      # --no-sources: treeparse from PyPI; b3_mat from GitHub (slim deps:
      # OrthotropicMaterial only — no lamprop/composipy). frd2vtu stays a
      # direct git URL from the project deps table.
      - name: Install dependencies
        run: |
          uv pip install --no-sources \
            "b3_mat @ git+https://github.com/wr1/b3_mat.git" \
            ".[dev]"

      # CalculiX / typst not installed — related tests self-skip.
      - name: Run tests
        run: |
          source .venv/bin/activate
          pytest -q --tb=short
