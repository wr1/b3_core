[project]
name = "b3_core"
version = "0.2.0"
description = "Homogenized elastic properties for sandwich-panel cores with sawcuts and machined grooves, via periodic-BC FEA (CalculiX / FEniCSx / MFEM)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "wr1" }]
keywords = [
    "homogenization",
    "sandwich",
    "foam",
    "kerf",
    "curvature",
    "fea",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib~=3.9",
    "pyvista>=0.44,<0.50",
    "frd2vtu @ git+https://github.com/wr1/frd2vtu.git",
    "pydantic>=2.0",
    "pyyaml",
    "treeparse",
    "mfem",
    "b3_mat @ git+https://github.com/wr1/b3_mat.git",
]

[project.optional-dependencies]
interactive = ["trame", "trame-vtk", "trame-vuetify"]
anim = ["imageio", "imageio-ffmpeg", "pillow"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.8",
    "pre-commit>=4.0",
]

[project.urls]
Homepage = "https://github.com/wr1/b3_core"
Repository = "https://github.com/wr1/b3_core"
Issues = "https://github.com/wr1/b3_core/issues"
Changelog = "https://github.com/wr1/b3_core/blob/master/CHANGELOG.md"

[project.scripts]
b3_core = "b3_core.core.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/b3_core"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/pyproject.toml",
    "/SKILL.md",
]

# Local monorepo: temporarily restore
#   [tool.uv.sources]
#   b3_mat = { path = "../b3_mat" }
# Default: b3_mat is the git URL in [project].dependencies (same pattern as
# frd2vtu). treeparse resolves from PyPI. Do not pin absolute machine paths.
[tool.uv]
override-dependencies = [
    # mfem 4.8 still declares numba==0.53 → llvmlite 0.36, which cannot build
    # on Python 3.12. Keep a modern numba so uv sync works on the CI matrix.
    "numba>=0.60",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=b3_core",
    "--cov-report=term-missing:skip-covered",
    "--cov-fail-under=90",
]

[tool.coverage.run]
branch = false
source = ["b3_core"]
# Optional / offline paths: not exercised on default CI (no FEniCSx/ccx/anim
# extras; sweep GIFs and legacy post CLIs are manual demos).
omit = [
    "*/b3_core/io/fenicsx.py",
    "*/b3_core/io/runccx.py",
    "*/b3_core/io/vts2ccx_planar.py",
    "*/b3_core/viz/animate.py",
    "*/b3_core/sweep/gifs.py",
    "*/b3_core/sweep/plots.py",
    "*/b3_core/sweep/render_viz.py",
    "*/b3_core/post/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# Gate CI on pyflakes + pycodestyle + isort. Broader rules (UP/SIM/B) can be
# enabled later without blocking the first release.
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes
    "I", # isort
]
ignore = [
    "E501", # line length handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402"]
"examples/**" = ["E402", "F401", "F841"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
