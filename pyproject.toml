[project]
name = "b3_core"
version = "0.3.0"
description = "Homogenized elastic properties for sandwich-panel cores with sawcuts and machined grooves, via periodic-BC FEA (CalculiX / FEniCSx / MFEM)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "wr1" }]
keywords = [
    "homogenization",
    "sandwich",
    "foam",
    "kerf",
    "curvature",
    "fea",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib~=3.9",
    "pyvista>=0.44,<0.45",
    "pydantic>=2.0",
    "pyyaml",
    "treeparse",
    "rich>=13",
    "mfem",
    # Pinned until these packages are on PyPI. frd2vtu v0.2.0 is the current tag;
    # b3_mat has no tag, so the pin is the commit uv resolved on 2026-09-29.
    "frd2vtu @ git+https://github.com/wr1/frd2vtu.git@v0.2.0",
    "b3_mat @ git+https://github.com/wr1/b3_mat.git@135fc4d4384d6470045b5776025ab9e41c35a176",
]

[project.optional-dependencies]
interactive = ["trame", "trame-vtk", "trame-vuetify"]
anim = ["imageio", "imageio-ffmpeg", "pillow"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.8",
    "pre-commit>=4.0",
    "import-linter>=2.0",
]
# conda-forge only (fenics-dolfinx, dolfinx_mpc, mpi4py, petsc4py). The
# test-fenicsx job installs that stack; it is not on PyPI as a universal extra.
fenicsx = []
ccx = []

[project.urls]
Homepage = "https://github.com/wr1/b3_core"
Repository = "https://github.com/wr1/b3_core"
Issues = "https://github.com/wr1/b3_core/issues"
Changelog = "https://github.com/wr1/b3_core/blob/master/CHANGELOG.md"

[project.scripts]
b3_core = "b3_core.core.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/b3_core"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/pyproject.toml",
    "/SKILL.md",
]

# Local monorepo: temporarily restore
#   [tool.uv.sources]
#   b3_mat = { path = "../b3_mat" }
# Default: b3_mat is the git URL in [project].dependencies (same pattern as
# frd2vtu). treeparse resolves from PyPI. Do not pin absolute machine paths.
[tool.uv]
override-dependencies = [
    # mfem 4.8 still declares numba==0.53 → llvmlite 0.36, which cannot build
    # on Python 3.12. uv overrides that pin. pip cannot; see README
    # "Python 3.12 and pip". TODO: link the PyMFEM issue once opened
    # (the pin should allow numba>=0.60).
    "numba>=0.60",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "--cov=b3_core",
    "--cov-report=term-missing:skip-covered",
    "--cov-fail-under=90",
]
markers = [
    "fenicsx: needs a conda-forge FEniCSx environment",
    "ccx: needs the calculix-ccx binary on PATH",
]

[tool.coverage.run]
branch = false
source = ["b3_core"]
# Optional / offline paths: not exercised on default CI (no FEniCSx, ccx,
# typst, or anim extras). The CalculiX solve and the legacy post CLIs run in
# the calculix job or by hand; sweep GIFs are manual demos.
omit = [
    "*/b3_core/solvers/fenicsx.py",
    "*/b3_core/solvers/calculix/runner.py",
    "*/b3_core/solvers/calculix/planar.py",
    "*/b3_core/solvers/calculix/base.py",
    "*/b3_core/solvers/calculix/backend.py",
    "*/b3_core/solvers/calculix/post.py",
    "*/b3_core/solvers/calculix/planar_post.py",
    "*/b3_core/viz/animate.py",
    "*/b3_core/sweep/gifs.py",
    "*/b3_core/sweep/plots.py",
    "*/b3_core/sweep/render_viz.py",
    "*/b3_core/post/*",
]

[tool.importlinter]
root_package = "b3_core"

[[tool.importlinter.contracts]]
name = "Backend independence"
type = "independence"
modules = [
    "b3_core.solvers.mfem",
    "b3_core.solvers.fenicsx",
    "b3_core.solvers.numpy_fe",
    "b3_core.solvers.calculix",
]

[[tool.importlinter.contracts]]
name = "Homogenisation layers"
type = "layers"
layers = [
    "b3_core.api",
    "b3_core.pipeline",
    "b3_core.solvers",
    "b3_core.core",
]
ignore_imports = [
    "b3_core.core.cprop -> b3_core.api",
    # The CLI lives in core/run.py and wires the layers above it.
    "b3_core.core.run -> b3_core.**",
]

[[tool.importlinter.contracts]]
name = "Viz and sweep stay off solvers"
type = "forbidden"
source_modules = [
    "b3_core.viz",
    "b3_core.sweep",
]
forbidden_modules = [
    "b3_core.solvers",
]
# Spec: viz and sweep reach solvers only through pipeline, never by a direct import.
allow_indirect_imports = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# Gate CI on pyflakes + pycodestyle + isort. Broader rules (UP/SIM/B) can be
# enabled later without blocking the first release.
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes
    "I", # isort
]
ignore = [
    "E501", # line length handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402"]
"examples/**" = ["E402", "F401", "F841"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
